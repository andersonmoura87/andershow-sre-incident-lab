name: Validar documentação
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estrutura mínima
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f templates/incident-report.md
          shopt -s nullglob
          reports=(incidents/*/incident-report.md)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo 'Nenhum relatório encontrado em incidents/*/incident-report.md'
            exit 1
          fi
          for report in "${reports[@]}"; do
            if ! test -s "$report"; then
              echo "Relatório ausente ou vazio: $report"
              exit 1
            fi
            echo "Relatório verificado: $report"
          done
          if grep -R -n -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' --include='*.md' .; then
            echo 'Possível segredo detectado'
            exit 1
          fi
